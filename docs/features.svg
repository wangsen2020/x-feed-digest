<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">X Feed Digest 核心能力</title><desc id="desc">Four connected stages: capture, digest, filter and analyze.</desc><rect width="1280" height="520" fill="#0b1116"/>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#18313e" stroke-width="1"/></pattern></defs><rect width="1280" height="520" fill="url(#grid)" opacity=".46"/>
  <text x="64" y="76" fill="#f4f8fa" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="750">从关注流到可行动的创作线索</text><text x="64" y="108" fill="#94aab5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16">在浏览器本地完成抓取、筛选、续传和分析；数据路径始终清晰可见。</text>
  <path d="M278 264h42M588 264h42M898 264h42" stroke="#3c7890" stroke-width="3" stroke-linecap="round"/><path d="M320 256l12 8-12 8M630 256l12 8-12 8M940 256l12 8-12 8" fill="none" stroke="#28b7e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(64 150)"><rect width="214" height="250" rx="16" fill="#101d27" stroke="#245166" stroke-width="2"/><rect x="20" y="22" width="48" height="48" rx="12" fill="#123443"/><path d="M34 39h20v14H41l-7 7v-7z" fill="none" stroke="#47c8ef" stroke-width="2.5" stroke-linejoin="round"/><text x="20" y="108" fill="#f4f8fa" font-size="21" font-weight="750">捕获请求模板</text><text x="20" y="139" fill="#b9c7cf" font-size="15">从 x.com 页面捕获</text><text x="20" y="162" fill="#b9c7cf" font-size="15">时间线与关注列表请求。</text><rect x="20" y="195" width="174" height="32" rx="6" fill="#0b151c" stroke="#244554"/><circle cx="37" cy="211" r="4" fill="#28b7e8"/><path d="M49 211h67M49 219h112" stroke="#5c7784" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(374 150)"><rect width="214" height="250" rx="16" fill="#101d27" stroke="#245166" stroke-width="2"/><rect x="20" y="22" width="48" height="48" rx="12" fill="#123443"/><path d="M34 43h20M34 51h14M34 59h20" stroke="#47c8ef" stroke-width="2.5" stroke-linecap="round"/><path d="M56 38l7 6-7 6" fill="none" stroke="#47c8ef" stroke-width="2"/><text x="20" y="108" fill="#f4f8fa" font-size="21" font-weight="750">本地汇总与续传</text><text x="20" y="139" fill="#b9c7cf" font-size="15">候选帖、进度与批次</text><text x="20" y="162" fill="#b9c7cf" font-size="15">持久保存在本地存储。</text><rect x="20" y="195" width="174" height="32" rx="6" fill="#0b151c" stroke="#244554"/><path d="M35 211h13l7-8 8 16 8-10h18" fill="none" stroke="#28b7e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(684 150)"><rect width="214" height="250" rx="16" fill="#101d27" stroke="#245166" stroke-width="2"/><rect x="20" y="22" width="48" height="48" rx="12" fill="#123443"/><path d="M34 39h25M34 48h19M34 57h11" stroke="#47c8ef" stroke-width="2.5" stroke-linecap="round"/><path d="M55 55l5 5 10-13" fill="none" stroke="#47c8ef" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="108" fill="#f4f8fa" font-size="21" font-weight="750">规则化筛选</text><text x="20" y="139" fill="#b9c7cf" font-size="15">按互动、粉丝、文本形态</text><text x="20" y="162" fill="#b9c7cf" font-size="15">与更新频率压低噪声。</text><rect x="20" y="195" width="174" height="32" rx="6" fill="#0b151c" stroke="#244554"/><path d="M35 211h48M35 219h93M140 211h36M140 219h20" stroke="#28b7e8" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(994 150)"><rect width="214" height="250" rx="16" fill="#101d27" stroke="#245166" stroke-width="2"/><rect x="20" y="22" width="48" height="48" rx="12" fill="#123443"/><path d="M37 58c6-18 19-18 25 0M39 52c5-8 14-8 19 0M47 41h1" fill="none" stroke="#47c8ef" stroke-width="2.5" stroke-linecap="round"/><text x="20" y="108" fill="#f4f8fa" font-size="21" font-weight="750">Grok 创作洞察</text><text x="20" y="139" fill="#b9c7cf" font-size="15">将已保留的候选帖交给</text><text x="20" y="162" fill="#b9c7cf" font-size="15">Grok 生成可借鉴建议。</text><rect x="20" y="195" width="174" height="32" rx="6" fill="#0b151c" stroke="#244554"/><path d="M35 211h83M35 219h124" stroke="#28b7e8" stroke-width="3" stroke-linecap="round"/><circle cx="173" cy="215" r="9" fill="#28b7e8"/></g>
  </g><rect x="64" y="440" width="1144" height="1" fill="#245166"/><circle cx="74" cy="472" r="5" fill="#28b7e8"/><text x="90" y="478" fill="#a8c0ca" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15">不依赖官方 API · 请求模板随正常浏览自动更新 · 支持定时执行与失败后的本地兜底</text>
</svg>
